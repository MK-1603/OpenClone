<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="50%" stop-color="#0D0D11"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Standard Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>

    <!-- Gold Accent Card Gradient -->
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1710"/>
      <stop offset="100%" stop-color="#12100A"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#52525B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 8px; font-weight: 700; letter-spacing: 0.8px; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 8.5px; line-height: 12.5px; fill: #8E8E93; }
  </style>

  <!-- Canvas Outer Container -->
  <rect width="1360" height="280" rx="14" fill="url(#bgGrad)" stroke="#1F1F24" stroke-width="1"/>

  <!-- Header Category & Flow Indicator -->
  <text x="40" y="34" class="title-text" font-size="11" font-weight="700" letter-spacing="1.5" fill="#D4AF37">OPENCLONE GOVERNED ENGINEERING LIFECYCLE</text>
  <text x="450" y="34" class="title-text" font-size="11" font-weight="400" fill="#71717A">·   Deterministic Left-to-Right Execution Pipeline</text>
  <text x="1320" y="34" class="title-text" font-size="10" font-weight="600" text-anchor="end" letter-spacing="0.5" fill="#52525B">AISDF STANDARD 1.0.0</text>
  <line x1="40" y1="46" x2="1320" y2="46" stroke="#1C1C21" stroke-width="1"/>

  <!-- ==================== 1. PROJECT UNDERSTANDING ==================== -->
  <g transform="translate(30, 62)">
    <rect width="145" height="194" rx="9" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1"/>
    <!-- Step Badge -->
    <rect x="12" y="12" width="68" height="16" rx="4" fill="#1C1C22" stroke="#2E2E36" stroke-width="0.75"/>
    <text x="46" y="23" text-anchor="middle" class="badge-text" fill="#A1A1AA">01 · INTAKE</text>
    <!-- Icon: Document / Contract -->
    <g transform="translate(14, 38)" stroke="#E4E4E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 3 2 L 13 2 L 19 8 L 19 22 L 3 22 Z"/>
      <path d="M 13 2 L 13 8 L 19 8"/>
      <line x1="7" y1="13" x2="15" y2="13"/>
      <line x1="7" y1="17" x2="12" y2="17"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#F4F4F5">Project</text>
    <text x="14" y="94" class="card-title" fill="#F4F4F5">Understanding</text>
    <text x="14" y="118" class="card-desc">
      <tspan x="14" dy="0">Intakes user intent into</tspan>
      <tspan x="14" dy="13">immutable PROJECT.md</tspan>
      <tspan x="14" dy="13">source of truth with</tspan>
      <tspan x="14" dy="13">traceable requirements.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#52525B">WF-001 · PROJECT.MD</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 179 159 L 192 159" stroke="#3F3F46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 2. PROJECT INTELLIGENCE ==================== -->
  <g transform="translate(195, 62)">
    <rect width="145" height="194" rx="9" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1"/>
    <!-- Step Badge -->
    <rect x="12" y="12" width="76" height="16" rx="4" fill="#1C1C22" stroke="#2E2E36" stroke-width="0.75"/>
    <text x="50" y="23" text-anchor="middle" class="badge-text" fill="#A1A1AA">02 · TAXONOMY</text>
    <!-- Icon: Compass / Classifier -->
    <g transform="translate(14, 38)" stroke="#E4E4E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="9"/>
      <polygon points="11,6 13.5,10 16,11 12,13.5 11,16 8.5,12 6,11 10,8.5" fill="#2E2E36"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#F4F4F5">Project</text>
    <text x="14" y="94" class="card-title" fill="#F4F4F5">Intelligence</text>
    <text x="14" y="118" class="card-desc">
      <tspan x="14" dy="0">Multi-label classification</tspan>
      <tspan x="14" dy="13">across 12 families, target</tspan>
      <tspan x="14" dy="13">delivery platforms, and</tspan>
      <tspan x="14" dy="13">independent complexity.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#52525B">12 FAMILIES · BLUEPRINT</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 344 159 L 357 159" stroke="#3F3F46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 3. ENGINEERING PLANNING ==================== -->
  <g transform="translate(360, 62)">
    <rect width="145" height="194" rx="9" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1"/>
    <!-- Step Badge -->
    <rect x="12" y="12" width="70" height="16" rx="4" fill="#1C1C22" stroke="#2E2E36" stroke-width="0.75"/>
    <text x="47" y="23" text-anchor="middle" class="badge-text" fill="#A1A1AA">03 · TASK DAG</text>
    <!-- Icon: Network / DAG Graph -->
    <g transform="translate(14, 38)" stroke="#E4E4E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="4" cy="5" r="2.5" fill="#2E2E36"/>
      <circle cx="18" cy="5" r="2.5" fill="#2E2E36"/>
      <circle cx="11" cy="18" r="2.5" fill="#2E2E36"/>
      <line x1="6.5" y1="5" x2="15.5" y2="5"/>
      <line x1="5.5" y1="7" x2="9.5" y2="16"/>
      <line x1="16.5" y1="7" x2="12.5" y2="16"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#F4F4F5">Engineering</text>
    <text x="14" y="94" class="card-title" fill="#F4F4F5">Planning</text>
    <text x="14" y="118" class="card-desc">
      <tspan x="14" dy="0">Partitions 31 domains &amp;</tspan>
      <tspan x="14" dy="13">56 engines into an</tspan>
      <tspan x="14" dy="13">acyclic dependency DAG</tspan>
      <tspan x="14" dy="13">with strict state gates.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#52525B">WF-003 · 56 ENGINES</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 509 159 L 522 159" stroke="#3F3F46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 4. SPECIALIST WORKFORCE ==================== -->
  <g transform="translate(525, 62)">
    <rect width="145" height="194" rx="9" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1"/>
    <!-- Step Badge -->
    <rect x="12" y="12" width="76" height="16" rx="4" fill="#1C1C22" stroke="#2E2E36" stroke-width="0.75"/>
    <text x="50" y="23" text-anchor="middle" class="badge-text" fill="#A1A1AA">04 · WORKFORCE</text>
    <!-- Icon: Specialist Team -->
    <g transform="translate(14, 38)" stroke="#E4E4E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="6" r="3.5"/>
      <path d="M 5 19 C 5 14.5 7.5 13 11 13 C 14.5 13 17 14.5 17 19"/>
      <path d="M 1 17 C 1 14 3 13 5 12.5"/>
      <path d="M 21 17 C 21 14 19 13 17 12.5"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#F4F4F5">Specialist</text>
    <text x="14" y="94" class="card-title" fill="#F4F4F5">Workforce</text>
    <text x="14" y="118" class="card-desc">
      <tspan x="14" dy="0">Assembles minimum team</tspan>
      <tspan x="14" dy="13">across 72 native roles,</tspan>
      <tspan x="14" dy="13">14 Agency divisions, and</tspan>
      <tspan x="14" dy="13">human domain advisors.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#52525B">72 ROLES · 14 DIVISIONS</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 674 159 L 687 159" stroke="#3F3F46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== 5. TOOL & MODEL SELECTION ==================== -->
  <g transform="translate(690, 62)">
    <rect width="145" height="194" rx="9" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1"/>
    <!-- Step Badge -->
    <rect x="12" y="12" width="76" height="16" rx="4" fill="#1C1C22" stroke="#2E2E36" stroke-width="0.75"/>
    <text x="50" y="23" text-anchor="middle" class="badge-text" fill="#A1A1AA">05 · MIE ENGINE</text>
    <!-- Icon: CPU / AI Model Core -->
    <g transform="translate(14, 38)" stroke="#E4E4E7" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="4" width="14" height="14" rx="2.5"/>
      <rect x="8" y="8" width="6" height="6" fill="#2E2E36"/>
      <line x1="7" y1="1" x2="7" y2="4"/>
      <line x1="15" y1="1" x2="15" y2="4"/>
      <line x1="7" y1="18" x2="7" y2="21"/>
      <line x1="15" y1="18" x2="15" y2="21"/>
      <line x1="1" y1="7" x2="4" y2="7"/>
      <line x1="1" y1="15" x2="4" y2="15"/>
      <line x1="18" y1="7" x2="21" y2="7"/>
      <line x1="18" y1="15" x2="21" y2="15"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#F4F4F5">Tool &amp; Model</text>
    <text x="14" y="94" class="card-title" fill="#F4F4F5">Selection</text>
    <text x="14" y="118" class="card-desc">
      <tspan x="14" dy="0">Pairs tasks to GPT-6.2</tspan>
      <tspan x="14" dy="13">Astra, Sol, Terra &amp; local</tspan>
      <tspan x="14" dy="13">Ollama with sandboxed</tspan>
      <tspan x="14" dy="13">tool calling boundaries.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#52525B">MIE ROUTER · 20 TOOLS</text>
  </g>

  <!-- Arrow 5 -> 6 (Gold transition arrow) -->
  <path d="M 839 159 L 852 159" stroke="#8A7334" stroke-width="1.5" marker-end="url(#goldArrow)"/>

  <!-- ==================== 6. GOVERNED EXECUTION (GOLD ACCENT) ==================== -->
  <g transform="translate(855, 62)">
    <rect width="145" height="194" rx="9" fill="url(#goldCardGrad)" stroke="#8A7334" stroke-width="1.2"/>
    <!-- Step Badge (Gold) -->
    <rect x="12" y="12" width="78" height="16" rx="4" fill="#262013" stroke="#8A7334" stroke-width="0.75"/>
    <text x="51" y="23" text-anchor="middle" class="badge-text" fill="#E5C158">06 · GOVERNED</text>
    <!-- Icon: Shield / Digest Lock (Gold) -->
    <g transform="translate(14, 38)" stroke="#E5C158" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 11 2 L 19 5 L 19 12 C 19 17 15 20.5 11 22 C 7 20.5 3 17 3 12 L 3 5 Z"/>
      <rect x="8" y="10" width="6" height="5" rx="1" fill="#262013"/>
      <path d="M 9.5 10 L 9.5 8 C 9.5 7.2 10.1 6.5 11 6.5 C 11.9 6.5 12.5 7.2 12.5 8 L 12.5 10"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#FFFDF5">Governed</text>
    <text x="14" y="94" class="card-title" fill="#FFFDF5">Execution</text>
    <text x="14" y="118" class="card-desc" fill="#D1D1D6">
      <tspan x="14" dy="0" fill="#D4AF37">Cryptographic digest</tspan>
      <tspan x="14" dy="13">binding locks human</tspan>
      <tspan x="14" dy="13">approvals; invalidates on</tspan>
      <tspan x="14" dy="13">any scope shift.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#D4AF37">WF-009 · SHA-256 GATES</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 1004 159 L 1017 159" stroke="#8A7334" stroke-width="1.5" marker-end="url(#goldArrow)"/>

  <!-- ==================== 7. VERIFICATION & QA (GOLD ACCENT) ==================== -->
  <g transform="translate(1020, 62)">
    <rect width="145" height="194" rx="9" fill="url(#goldCardGrad)" stroke="#8A7334" stroke-width="1.2"/>
    <!-- Step Badge (Gold) -->
    <rect x="12" y="12" width="70" height="16" rx="4" fill="#262013" stroke="#8A7334" stroke-width="0.75"/>
    <text x="47" y="23" text-anchor="middle" class="badge-text" fill="#E5C158">07 · VERIFY</text>
    <!-- Icon: Checkmark Circle / Scanners (Gold) -->
    <g transform="translate(14, 38)" stroke="#E5C158" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="9"/>
      <polyline points="7,11 10,14 15,8"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#FFFDF5">Verification</text>
    <text x="14" y="94" class="card-title" fill="#FFFDF5">&amp; Quality QA</text>
    <text x="14" y="118" class="card-desc" fill="#D1D1D6">
      <tspan x="14" dy="0" fill="#D4AF37">Observable evidence:</tspan>
      <tspan x="14" dy="13">14 pinned scanners,</tspan>
      <tspan x="14" dy="13">209 passing tests &amp;</tspan>
      <tspan x="14" dy="13">zero broken links.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#D4AF37">WF-006 · GOLDFISH EGM</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 1169 159 L 1182 159" stroke="#8A7334" stroke-width="1.5" marker-end="url(#goldArrow)"/>

  <!-- ==================== 8. FINAL DELIVERY (GOLD ACCENT) ==================== -->
  <g transform="translate(1185, 62)">
    <rect width="145" height="194" rx="9" fill="url(#goldCardGrad)" stroke="#8A7334" stroke-width="1.2"/>
    <!-- Step Badge (Gold) -->
    <rect x="12" y="12" width="72" height="16" rx="4" fill="#262013" stroke="#8A7334" stroke-width="0.75"/>
    <text x="48" y="23" text-anchor="middle" class="badge-text" fill="#E5C158">08 · RELEASE</text>
    <!-- Icon: Rocket / Release Ship (Gold) -->
    <g transform="translate(14, 38)" stroke="#E5C158" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 12 2 C 16 5 19 9 19 14 L 16 16 L 14 14 L 12 16 L 10 14 L 8 16 L 5 14 C 5 9 8 5 12 2 Z"/>
      <circle cx="12" cy="8" r="2" fill="#262013"/>
      <path d="M 5 14 L 2 17 L 4 19 L 7 17"/>
      <path d="M 19 14 L 22 17 L 20 19 L 17 17"/>
    </g>
    <!-- Content -->
    <text x="14" y="80" class="card-title" fill="#FFFDF5">Final</text>
    <text x="14" y="94" class="card-title" fill="#FFFDF5">Delivery</text>
    <text x="14" y="118" class="card-desc" fill="#D1D1D6">
      <tspan x="14" dy="0" fill="#D4AF37">Cryptographic ledger</tspan>
      <tspan x="14" dy="13">sealed; verified release</tspan>
      <tspan x="14" dy="13">packages ready for</tspan>
      <tspan x="14" dy="13">production deployment.</tspan>
    </text>
    <!-- Footnote -->
    <text x="14" y="180" class="badge-text" fill="#D4AF37">WF-014 · PRODUCTION</text>
  </g>
</svg>
