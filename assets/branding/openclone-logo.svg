<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
    <defs>
        <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#38BDF8" />
        </linearGradient>
    </defs>
    <rect width="100%" height="100%" fill="#0B0F19" />
    <!-- Architectural grid pattern -->
    <path d="M0,130 L900,130 M220,0 L220,260" stroke="#1E293B" stroke-width="1" stroke-dasharray="4,4" opacity="0.4" />
    
    <!-- Symbol Mark -->
    <g transform="translate(40, 45) scale(1.7)">
            <!-- Hexagonal outer frame -->
            <polygon points="50,5 92,27 92,73 50,95 8,73 8,27" fill="#2563EB" opacity="0.95" />
            <!-- Inner facet bevels -->
            <polygon points="50,5 92,27 50,50 8,27" fill="#38BDF8" opacity="0.4" />
            <polygon points="8,27 50,50 50,95 8,73" fill="#000000" opacity="0.25" />
            <polygon points="50,50 92,27 92,73 50,95" fill="#38BDF8" opacity="0.15" />
            <!-- Code brackets glyph </ > -->
            <path d="M38,42 L28,50 L38,58 M62,42 L72,50 L62,58 M54,38 L46,62" 
                  fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
    
    <!-- Typographic Logotype -->
    <text x="250" y="135" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="76" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">
        OpenClone
    </text>
    
    <!-- Tagline -->
    <text x="254" y="175" font-family="'Inter', -apple-system, sans-serif" 
          font-size="20" font-weight="500" letter-spacing="1.2" fill="#38BDF8">
        Build with Any AI
    </text>
</svg>