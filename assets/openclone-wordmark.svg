<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background container with subtle border -->
  <rect width="800" height="160" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="799" height="159" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo Mark Icon -->
  <g transform="translate(60, 40)">
    <!-- Outer hexagon/shield -->
    <path d="M 40 0 L 75 20 L 75 60 L 40 80 L 5 60 L 5 20 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3" filter="url(#glow)"/>
    <!-- Inner orbital ring -->
    <circle cx="40" cy="40" r="18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Core node -->
    <circle cx="40" cy="40" r="8" fill="url(#accentGrad)"/>
  </g>

  <!-- Product Wordmark & Typography -->
  <text x="160" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" fill="#ffffff">
    Open<tspan fill="url(#accentGrad)">Clone</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="162" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" fill="#94a3b8">
    UNIVERSAL AI SOFTWARE ENGINEERING FRAMEWORK · AISDF
  </text>

  <!-- Status Chip -->
  <g transform="translate(650, 45)">
    <rect width="90" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">v1.0.0</text>
  </g>
</svg>
