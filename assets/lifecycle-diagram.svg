pf<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="920" height="180" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="919" height="179" rx="15.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <text x="460" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#f8fafc">
    INSTRUCTION-FIRST · DESIGN-FIRST · VERIFIED ENGINEERING LIFECYCLE
  </text>

  <!-- 7 Sequential Steps -->
  <!-- 1. DISCOVER -->
  <g transform="translate(30, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#38bdf8">01 · DISCOVER</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Scan instructions</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">AGENTS.md & rules</text>
  </g>
  <path d="M 140 100 L 152 100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. AUDIT SLOP -->
  <g transform="translate(155, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#f59e0b">02 · AUDIT SLOP</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Halt AI clichés</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Taste Skill scan</text>
  </g>

  <!-- 3. SPECIFY -->
  <g transform="translate(280, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#818cf8">03 · SPECIFY</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Design tokens</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Task contracts</text>
  </g>

  <!-- 4. GATE CHECK -->
  <g transform="translate(405, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#ef4444">04 · GATE CHECK</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Human approval</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">SHA-256 digest</text>
  </g>

  <!-- 5. BUILD -->
  <g transform="translate(530, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#10b981">05 · BUILD</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Smallest diff</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Governed tools</text>
  </g>

  <!-- 6. VERIFY -->
  <g transform="translate(655, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#06b6d4">06 · VERIFY</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Goldfish review</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">Evidence ledger</text>
  </g>

  <!-- 7. DEPLOY -->
  <g transform="translate(780, 55)">
    <rect width="105" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="52" y="28" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#a855f7">07 · DEPLOY</text>
    <text x="52" y="52" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">WF-014 pipeline</text>
    <text x="52" y="68" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#94a3b8">6 cloud adapters</text>
  </g>
</svg>
