name: OpenClone Extension CI/CD

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "plugins/**"
      - "extensions/**"
      - "src/openclone/integrations/**"
      - "tests/test_extension_ecosystem.py"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/**"
      - "extensions/**"
      - "src/openclone/integrations/**"
      - "tests/test_extension_ecosystem.py"
      - ".github/workflows/extension-ci.yml"

jobs:
  validate-extensions:
    name: Validate Manifests & Run Extension Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        node-version: ["20.x"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Validate Antigravity Plugin Schema & Assets
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          manifest = Path('plugins/openclone-antigravity/plugin.json')
          assert manifest.exists(), 'Antigravity plugin.json missing'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('name') == 'openclone'
          assert data.get('version') == '2.0.0'
          assert 'suggestedPrompts' in data
          print('Antigravity plugin manifest validated successfully.')
          "

      - name: Validate VS Code Extension Manifest
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          manifest = Path('extensions/vscode/package.json')
          assert manifest.exists(), 'VS Code package.json missing'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          assert data.get('name') == 'openclone-vscode'
          assert data.get('version') == '2.0.0'
          assert 'contributes' in data
          assert 'viewsContainers' in data['contributes']
          print('VS Code extension manifest validated successfully.')
          "

      - name: Run Extension Automated Tests
        run: |
          pytest tests/test_extension_ecosystem.py -v --tb=short

      - name: Build Antigravity Plugin Zip Artifact
        run: |
          mkdir -p dist
          python -c "import shutil; shutil.make_archive('dist/openclone-antigravity-2.0.0', 'zip', 'plugins/openclone-antigravity')"

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openclone-extension-packages
          path: dist/*
          if-no-files-found: ignore
