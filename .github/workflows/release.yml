name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version_check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e .[dev]

      - name: Validate Release Version Match
        id: version_check
        run: |
          python -c "
          import pathlib, tomllib, sys
          tag = '${{ github.ref_name }}'.lstrip('v')
          pyproj = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))
          version = pyproj['project']['version']
          assert tag == version, f'Git tag {tag} does not match pyproject.toml version {version}'
          print(f'Release version verified: {version}')
          with open(r'${{ github.output }}', 'a') as f:
              f.write(f'version={version}\n')
          "

      - name: Run Quality Gate
        run: |
          python tools/validate_repository.py
          python tools/check_links.py
          pytest tests/ -v

      - name: Build Distribution Packages
        run: |
          python -m build

      - name: Verify Package Integrity and Checksums
        run: |
          twine check dist/*
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openclone-dist
          path: dist/
          retention-days: 7

  create-github-release:
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          name: openclone-dist
          path: dist/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; refreshing assets..."
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --title "OpenClone ${{ github.ref_name }}" \
              --generate-notes
          fi

  publish-pypi:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openclone
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing OIDC
      contents: read
    steps:
      - name: Download Built Packages
        uses: actions/download-artifact@v4
        with:
          name: openclone-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
          # If PYPI_API_TOKEN secret exists, use it; otherwise fallback to OIDC Trusted Publishing
          password: ${{ secrets.PYPI_API_TOKEN }}
