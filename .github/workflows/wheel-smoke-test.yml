name: Wheel Installation Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Wheel Distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Wheel in Isolated Environment
        shell: python
        run: |
          import pathlib, subprocess, sys
          whls = list(pathlib.Path('dist').glob('*.whl'))
          assert whls, 'No wheels found in dist directory'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(whls[0])])

      - name: Verify CLI Entrypoint and Module Execution from Clean Working Directory
        shell: python
        run: |
          import pathlib, tempfile, subprocess, sys
          d = tempfile.mkdtemp()
          print(f"Running smoke tests in isolated directory: {d}")
          subprocess.check_call(["openclone", "--help"], cwd=d)
          subprocess.check_call(["openclone", "--version"], cwd=d)
          subprocess.check_call(["aisdf", "--help"], cwd=d)
          subprocess.check_call(["aisdf", "--version"], cwd=d)
          subprocess.check_call([sys.executable, "-c", "import openclone; print('Imported openclone from:', openclone.__file__)"], cwd=d)
