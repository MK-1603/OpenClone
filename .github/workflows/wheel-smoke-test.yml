name: Wheel Installation Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build Wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install Wheel in Isolated Environment
        run: |
          python -c "import pathlib, subprocess, sys; whl = list(pathlib.Path('dist').glob('*.whl'))[0]; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(whl)])"

      - name: Verify CLI Entrypoint and Module Execution
        run: |
          openclone --help
          aisdf --help
          python -m src.openclone.cli --help
